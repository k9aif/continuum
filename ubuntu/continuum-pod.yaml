# k9x_continuum — Podman Pod Spec (single-container deployment)
#
# Pod: k9-continuum-pod
# └── app-backend   FastAPI Enterprise Continuum catalog (port 8085)
#
# External services (published on the Podman host — see hostAliases below):
#   PostgreSQL → rhel-host:5432 (db "k9x", schema "k9repo" — self-creates
#   on startup via backend/database.py's init_schema())
#
# SETUP (run once):
#   # 0. Replace <RHEL_HOST_IP> in hostAliases below with this host's LAN IP
#   # 1. Build the image
#   podman build -t k9x-continuum:latest -f ubuntu/Containerfile .
#
#   # 2. Store the Postgres password as a Podman secret
#   podman secret create continuum-pg-password \
#     <(grep POSTGRES_PASSWORD .env | cut -d= -f2-)
#
# DEPLOY:
#   podman play kube ubuntu/continuum-pod.yaml --replace
#
# STOP:
#   podman play kube ubuntu/continuum-pod.yaml --down
#
# LOGS:
#   podman logs -f k9-continuum-pod-app-backend

apiVersion: v1
kind: Pod
metadata:
  name: k9-continuum-pod
  labels:
    app: k9x-continuum
    component: enterprise-continuum-catalog
    version: "0.1"
  annotations:
    description: "k9x_continuum — Enterprise Continuum catalog, single-container pod"

spec:
  restartPolicy: OnFailure

  hostAliases:
  - ip: "<RHEL_HOST_IP>"  # replace with this host's LAN IP before deploying (e.g. 192.168.1.244)
    hostnames:
    - "rhel-host"

  containers:

  # ── Container: app-backend ───────────────────────────────────────────────
  - name: app-backend
    image: localhost/k9x-continuum:latest
    imagePullPolicy: Never

    ports:
    - name: http
      containerPort: 8085
      hostPort: 8085
      protocol: TCP

    command: ["uvicorn"]
    args:
    - "backend.main:app"
    - "--host"
    - "0.0.0.0"
    - "--port"
    - "8085"
    - "--log-level"
    - "info"

    env:
    - name: POSTGRES_HOST
      value: "rhel-host"
    - name: POSTGRES_PORT
      value: "5432"
    - name: POSTGRES_DB
      value: "k9x"
    - name: POSTGRES_USER
      value: "postgres"
    - name: POSTGRES_SCHEMA
      value: "k9repo"
    - name: POSTGRES_PASSWORD
      valueFrom:
        secretKeyRef:
          name: continuum-pg-password
          key: continuum-pg-password
    - name: PYTHONUNBUFFERED
      value: "1"

    resources:
      requests:
        memory: "256Mi"
        cpu: "250m"
      limits:
        memory: "1Gi"
        cpu: "1"

    livenessProbe:
      httpGet:
        path: /health
        port: 8085
      initialDelaySeconds: 15
      periodSeconds: 30
      failureThreshold: 3

    readinessProbe:
      httpGet:
        path: /health
        port: 8085
      initialDelaySeconds: 10
      periodSeconds: 10
      failureThreshold: 5
